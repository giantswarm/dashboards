apiVersion: v2
description: Grafana dashboards accessible by Giant Swarm customers
home: https://github.com/giantswarm/dashboards
icon: https://s.giantswarm.io/app-icons/grafana/1/light.svg
name: dashboards
version: 4.34.0
annotations:
  io.giantswarm.application.team: "atlas"
dependencies:
  - name: observability
    version: 1.0.0
    condition: observability.enabled
  - name: kubernetes
    version: 1.0.0
    condition: kubernetes.enabled
  - name: cloud
    version: 1.0.0
    condition: cloud.enabled
  - name: security
    version: 1.0.0
    condition: security.enabled
  - name: networking
    version: 1.0.0
    condition: networking.enabled
  - name: app_platform
    version: 1.0.0
    condition: app_platform.enabled
appVersion: 4.34.0
