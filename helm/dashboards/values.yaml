global:
  name: dashboards
  namespace: monitoring
  serviceType: managed

  provider:
    kind: ""

  # Organization directories to render. Empty renders all of them.
  organizations:
    include: []

  # Maps an organization directory to the Grafana organization its dashboards target.
  # Only the organization annotation changes.
  organizationMap: {}

provider:
  kind: ""

# Dashboard capabilities. Each renders the dashboards of one subchart.
observability:
  enabled: true
kubernetes:
  enabled: true
cloud:
  enabled: true
security:
  enabled: true
networking:
  enabled: true
app_platform:
  enabled: true
